services:
  - type: web
    name: kumpelapp-webapp
    runtime: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=webapp
    startCommand: pnpm --filter webapp exec next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
